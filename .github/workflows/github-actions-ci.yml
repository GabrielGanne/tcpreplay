name: GitHub Actions Tests
run-name: ${{ github.actor }} is running tests using GitHub Actions
on: [push]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Install prereqs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt -y install autogen asciidoctor libpcap-dev automake autoconf libtool libxdp-dev liburing-dev
      - name: Install prereqs (macOS)
        if: runner.os == 'macOS'
        run: brew install libpcap automake autoconf libtool asciidoctor
      - name: Create a build directory
        run: mkdir -p build
      - name: Create configure script
        run: pushd build; ../autogen.sh; popd
      - name: configure
        run: pushd build; ../configure --disable-local-libopts --enable-debug --enable-test-hexdump; popd
      - name: make
        run: pushd build; make; popd
      - name: make dist
        run: pushd build; make dist; popd
      - name: make dist-xz
        run: pushd build; make dist-xz; popd
      - name: List files in the repository
        run: ls ${{ github.workspace }}
      - name: List interfaces via tcpreplay
        run: pushd build; sudo src/tcpreplay --listnics; popd
      - name: unit tests (make check)
        run: pushd build; make check || (cat test/unit/test-suite.log >&2; false); popd
      - name: tests
        run: pushd build; sudo make test || (cat test/test.log >&2; false); popd
      - name: io_uring variant tests
        if: runner.os == 'Linux'
        run: pushd build; sudo make -C test tcpreplay_io_uring || (cat test/test.log >&2; false); popd
      - name: verify committed tcpedit_stub.h is current (autogen)
        if: runner.os == 'Linux'
        run: ./scripts/check-generated-opts.sh
      - name: verify scripts/autoopts emitters run cleanly (*_opts.c/h, man pages)
        if: runner.os == 'Linux'
        run: |
          python3 scripts/autoopts/validate_ir.py
          python3 scripts/autoopts/check_emitters.py
          python3 scripts/autoopts/check_adoc.py
      - run: echo "This test's status is ${{ job.status }}."
  cmake-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Install prereqs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt -y install libpcap-dev libxdp-dev liburing-dev cmake
      - name: Install prereqs (macOS)
        if: runner.os == 'macOS'
        run: brew install libpcap cmake
      - name: configure
        run: cmake -B build-cmake -DENABLE_DEBUG=ON
      - name: build
        run: cmake --build build-cmake -j 4
      - name: unit tests (ctest)
        run: ctest --test-dir build-cmake --output-on-failure
      - name: smoke test
        run: |
          build-cmake/src/tcpreplay --version
          build-cmake/src/tcprewrite --version
          build-cmake/src/tcpprep --version
          build-cmake/src/tcpcapinfo --version
          sudo build-cmake/src/tcpreplay --listnics
      - name: verify rewrite output matches golden fixture
        run: |
          build-cmake/src/tcprewrite -i test/test.pcap -o portmap.pcap -r 80:8080
          cmp portmap.pcap test/test2.rewrite_portmap

  # AddressSanitizer build. --enable-asan has been supported for a long time
  # but nothing ever ran it, so the checking existed and was never applied
  # (#1093). Given that 15 memory-safety advisories were published against
  # this project in 2026 - every one reported from outside - running the
  # existing corpus under ASan is the cheapest coverage available: no new
  # tests, no new dependencies.
  #
  # Linux only: the integration suite needs a live interface, and a dummy
  # device gives one without touching the runner's real networking.
  #
  # UndefinedBehaviorSanitizer runs alongside, minus the alignment check.
  #
  # The two defects that blocked it are fixed (#1100): a misaligned struct
  # access in the MPLS parser and a left shift of a negative value in
  # fragroute's ip_ttl. Everything UBSan checks other than alignment is clean
  # across the whole suite.
  #
  # -fno-sanitize=alignment because misaligned access is systemic rather than a
  # defect or two: parsing a packet here means casting a buffer offset to a
  # header struct, and an Ethernet payload starts 14 bytes in, so any 4-byte
  # field in it is misaligned by construction. 15 sites across get.c, flows.c
  # and en10mb.c (#1104). Leaving the check on would mean a red job and no
  # coverage of anything else; turning it off keeps the integer-overflow,
  # shift and bad-enum checks working today, and #1104 can re-enable it.
  #
  # Leak detection is off for the same reason: the tools exit without freeing
  # everything, and that is a separate cleanup from memory-corruption
  # coverage, which is the class the advisories actually fall into.
  asan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Install prereqs
        run: sudo apt -y install autogen asciidoctor libpcap-dev automake autoconf libtool libxdp-dev liburing-dev
      - name: Create a dummy interface for the replay tests
        run: |
          sudo ip link add dummy0 type dummy
          sudo ip link set dummy0 up
      - name: Create a build directory
        run: mkdir -p build-asan
      - name: Create configure script
        run: pushd build-asan; ../autogen.sh; popd
      - name: configure
        run: |
          pushd build-asan
          ../configure --enable-asan --with-testnic=dummy0 --with-testnic2=dummy0 \
            CFLAGS="-fsanitize=undefined -fno-sanitize=alignment -fno-sanitize-recover=undefined -g -O1"
          popd
      - name: make
        run: pushd build-asan; make -j 4; popd
      - name: unit tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: pushd build-asan; make check || (cat test/unit/test-suite.log >&2; false); popd
      - name: integration suite under ASan + UBSan
        run: |
          pushd build-asan
          sudo ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 make test \
            || (cat test/test.log >&2; false)
          popd
