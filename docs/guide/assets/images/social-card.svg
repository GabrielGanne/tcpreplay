<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Source for the GitHub repository social preview card.

       GitHub only accepts PNG/JPG for that field, so this is rendered to
       social-card.png alongside it (any headless browser screenshot at
       1280x640 will do), and the PNG is uploaded by hand under
       Settings, General, Social preview. There is no API for it.

       1280x640 is the size GitHub documents. Keep content inside a 96px
       margin so nothing important is lost if the card is cropped. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00695c"/>
      <stop offset="1" stop-color="#00332c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe8dc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- The mark, scaled from its 24x24 artboard to 224px. -->
  <g transform="translate(150 208) scale(9.333)" fill="url(#mark)">
    <path d="M12 2.8 A9.2 9.2 0 1 0 21.2 12 L19.2 12 A7.2 7.2 0 1 1 12 4.8 Z"/>
    <path d="M12 1.3 L16.6 3.8 L12 6.3 Z"/>
    <path d="M9.8 8.5 L15.8 12 L9.8 15.5 Z"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="440" y="296" font-size="104" font-weight="300"
          letter-spacing="-2">Tcpreplay</text>
    <text x="446" y="356" font-size="35" font-weight="300" fill="#a7ddd4">
      Edit and replay captured network traffic
    </text>
    <text x="446" y="410" font-size="35" font-weight="300" fill="#a7ddd4">
      at controlled speeds.
    </text>
    <text x="446" y="486" font-size="27" font-weight="400" fill="#5fbfae"
          letter-spacing="1">tcpreplay.appneta.com</text>
  </g>
</svg>
